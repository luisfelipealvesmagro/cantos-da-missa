<input type="text" placeholder="Nome da categoria"
       [value]="name()" (input)="onNameInput($any($event.target).value)"
       (keyup.enter)="onSave()" />
@if (error()) {
  <p class="form-error">{{ error() }}</p>
}
<div class="icon-picker">
  @for (ic of iconOptions; track ic) {
    <button class="icon-opt" [class.sel]="icon() === ic" (click)="icon.set(ic)" [attr.aria-label]="ic">
      <app-icon [name]="ic" [size]="22" />
    </button>
  }
</div>
<div class="form-actions">
  <button class="btn btn-ghost" (click)="onCancel()">Cancelar</button>
  <button class="btn btn-primary" (click)="onSave()">Salvar</button>
</div>
